<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ME NPI 生产自检表</title>
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NPI自检表">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
// PWA install prompt - capture browser's install event
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'inline-flex';
});

// Service Worker - only register on HTTP/HTTPS (not file://)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(() => {});
}
</script>
<style>
:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --primary: #1a73e8;
  --pass: #34a853;
  --fail: #ea4335;
  --na: #9aa0a6;
  --warn: #f9ab00;
  --text: #202124;
  --text2: #5f6368;
  --border: #dadce0;
  --radius: 12px;
  --danger: #d93025;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: 80px;
}

/* Header */
.header {
  background: linear-gradient(135deg, #1a73e8, #4285f4);
  color: #fff;
  padding: 20px 16px 16px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { flex:1; }
.header h1 { font-size: 18px; font-weight: 700; }
.header p { font-size: 12px; opacity: .85; margin-top: 2px; }
.header-actions { display: flex; gap: 8px; }
.header-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,.2); border: none; color: #fff;
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
}
.header-btn:active { background: rgba(255,255,255,.35); }
.header-btn.active { background: rgba(255,255,255,.45); }

/* PWA install hint banner */
.install-hint {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; background: #E8F0FE; color: #1a73e8;
  font-size: 13px; line-height: 1.4;
}
.install-hint button {
  background: none; border: none; color: #1a73e8; font-size: 18px;
  cursor: pointer; padding: 0 4px; flex-shrink: 0;
}

/* Draft tabs bar */
.draft-bar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex; gap: 8px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  position: sticky; top: 72px; z-index: 99;
}
.draft-bar::-webkit-scrollbar { display: none; }
.draft-tab {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  font-size: 13px; font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.draft-tab:active { transform: scale(.97); }
.draft-tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.draft-tab .tab-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.tab-dot-filling { background: var(--warn); }
.tab-dot-done { background: var(--pass); }
.tab-dot-empty { background: var(--border); }
.draft-tab .tab-close {
  margin-left: 4px; width: 16px; height: 16px;
  border-radius: 50%; border: none;
  background: rgba(0,0,0,.15); color: #fff;
  font-size: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.draft-tab .tab-close:active { background: rgba(0,0,0,.3); }
.draft-add-btn {
  flex-shrink: 0;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1.5px dashed var(--border);
  background: transparent;
  font-size: 18px; color: var(--text2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.draft-add-btn:active { border-color: var(--primary); color: var(--primary); }

/* Meta form */
.meta-card {
  background: var(--card);
  margin: 12px;
  padding: 16px;
  border-radius: var(--radius);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.meta-row {
  display: flex; gap: 10px; margin-bottom: 10px;
}
.meta-row:last-child { margin-bottom: 0; }
.meta-field {
  flex: 1; display: flex; flex-direction: column;
}
.meta-field label {
  font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 600;
}
.meta-field input {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}
.meta-field input:focus { border-color: var(--primary); }

/* Section group */
.section { margin: 12px; }
.section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 700;
  padding: 10px 0 6px;
  color: var(--text);
}
.section-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot-prep { background: var(--warn); }
.dot-teach { background: #e8710a; }
.dot-process { background: var(--primary); }
.dot-close { background: var(--pass); }
.dot-custom { background: #7b1fa2; }

/* Item card */
.item-card {
  background: var(--card);
  border-radius: var(--radius);
  margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  overflow: hidden;
  transition: box-shadow .2s;
}
.item-card.fail-card { box-shadow: 0 0 0 2px var(--fail); }
.item-header {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 12px 14px 8px;
}
.item-no {
  min-width: 24px; height: 24px;
  background: var(--bg); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text2);
  flex-shrink: 0;
}
.item-text { flex: 1; font-size: 14px; line-height: 1.45; }

/* Toggle buttons */
.toggle-row { display: flex; gap: 0; padding: 4px 14px 10px; }
.toggle-btn {
  flex: 1; border: none; padding: 8px 0;
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s;
  background: var(--bg); color: var(--text2);
}
.toggle-btn:first-child { border-radius: 8px 0 0 8px; }
.toggle-btn:last-child { border-radius: 0 8px 8px 0; }
.toggle-btn:active { transform: scale(.97); }
.toggle-btn.pass-on { background: var(--pass); color: #fff; }
.toggle-btn.fail-on { background: var(--fail); color: #fff; }
.toggle-btn.na-on { background: var(--na); color: #fff; }

/* Remark */
.remark-area { padding: 0 14px 10px; }
.remark-input {
  width: 100%; border: 1.5px solid var(--border);
  border-radius: 8px; padding: 7px 10px;
  font-size: 13px; resize: none; outline: none;
  font-family: inherit; min-height: 36px;
  transition: border-color .2s;
}
.remark-input:focus { border-color: var(--primary); }

/* Photo */
.photo-area { padding: 0 14px 12px; }
.photo-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--bg); border: 1.5px dashed var(--border);
  border-radius: 8px; padding: 8px 14px;
  font-size: 13px; color: var(--text2); cursor: pointer;
}
.photo-btn:active { border-color: var(--primary); }
.photo-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.photo-thumb {
  position: relative; width: 56px; height: 56px;
  border-radius: 6px; overflow: hidden;
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb .del-photo {
  position: absolute; top: -2px; right: -2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(0,0,0,.6); color: #fff;
  border: none; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.photo-input { display: none; }

/* Bottom bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; gap: 10px;
  z-index: 100;
}
.bottom-bar .btn {
  flex: 1; border: none; border-radius: 10px;
  padding: 12px 0; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.btn:active { transform: scale(.97); }
.btn-save { background: var(--bg); color: var(--text); }
.btn-submit { background: var(--primary); color: #fff; }

/* Progress */
.progress-bar { height: 3px; background: var(--border); }
.progress-fill { height: 100%; background: var(--primary); transition: width .3s; }
.progress-text { padding: 6px 16px 0; font-size: 12px; color: var(--text2); text-align: right; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--card);
  border-radius: 16px;
  width: 100%; max-width: 380px;
  max-height: 85vh; overflow: hidden;
  display: flex; flex-direction: column;
}
.modal-header {
  padding: 16px; font-size: 16px; font-weight: 700;
  text-align: center; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-body { padding: 16px; overflow-y: auto; font-size: 14px; line-height: 1.6; flex: 1; }
.modal-body .summary-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; }
.modal-body .si-icon { font-size: 16px; flex-shrink: 0; }
.modal-body .si-text { flex: 1; }
.modal-footer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.modal-footer .btn { flex: 1; }

/* Toast */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(.9);
  background: rgba(0,0,0,.75); color: #fff;
  padding: 12px 24px; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  opacity: 0; transition: all .25s;
  z-index: 300; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* History */
.history-section { margin: 12px; }
.history-card {
  background: var(--card); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.history-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.history-model { font-weight: 700; color: var(--text); }
.history-stats { font-size: 12px; color: var(--text2); }

/* Signature */
.sig-area { padding: 12px 14px; border-top: 1px solid var(--border); }
.sig-area label { font-size: 12px; color: var(--text2); font-weight: 600; }
.sig-canvas { width: 100%; height: 80px; border: 1.5px solid var(--border); border-radius: 8px; margin-top: 6px; touch-action: none; }
.sig-clear { font-size: 12px; color: var(--primary); background: none; border: none; cursor: pointer; margin-top: 4px; }

/* ===== EDIT MODE ===== */
body.edit-mode { padding-bottom: 130px; }
.edit-banner {
  background: #fff3e0; color: #e65100;
  text-align: center; font-size: 13px; font-weight: 600;
  padding: 6px 0;
  position: sticky; top: 72px; z-index: 99;
  border-bottom: 1px solid #ffe0b2;
}
.edit-section-card {
  background: var(--card); border-radius: var(--radius);
  margin: 8px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden;
}
.edit-section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; background: #fafafa;
  border-bottom: 1px solid var(--border);
}
.edit-section-header .sec-name { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 700; color: var(--text); outline: none; padding: 4px 0; }
.edit-section-header .sec-name:focus { border-bottom: 2px solid var(--primary); }
.edit-sec-btn {
  width: 28px; height: 28px; border-radius: 6px;
  border: none; background: var(--bg); cursor: pointer;
  font-size: 14px; color: var(--text2);
  display: flex; align-items: center; justify-content: center;
}
.edit-sec-btn:active { background: var(--border); }
.edit-sec-btn.danger { color: var(--danger); }
.edit-item-row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid #f5f5f5; }
.edit-item-row:last-child { border-bottom: none; }
.edit-item-no { min-width: 22px; font-size: 12px; color: var(--text2); font-weight: 700; text-align: center; }
.edit-item-text { flex: 1; border: none; background: transparent; font-size: 14px; color: var(--text); outline: none; padding: 4px 0; }
.edit-item-text:focus { border-bottom: 2px solid var(--primary); }
.edit-item-btn {
  width: 28px; height: 28px; border-radius: 6px;
  border: none; background: transparent; cursor: pointer;
  font-size: 13px; color: var(--text2);
  display: flex; align-items: center; justify-content: center;
}
.edit-item-btn:active { background: var(--bg); }
.edit-item-btn.danger { color: var(--danger); }
.edit-photo-toggle {
  width: 28px; height: 28px; border-radius: 6px;
  border: none; background: transparent; cursor: pointer;
  font-size: 15px; color: var(--border);
  display: flex; align-items: center; justify-content: center;
}
.edit-photo-toggle.has-photo { color: var(--primary); }
.edit-add-row { padding: 8px 12px; display: flex; gap: 8px; }
.edit-add-btn {
  border: 1.5px dashed var(--border); border-radius: 8px;
  padding: 6px 14px; background: transparent; cursor: pointer;
  font-size: 13px; color: var(--text2);
  display: flex; align-items: center; gap: 4px;
}
.edit-add-btn:active { border-color: var(--primary); color: var(--primary); }
.edit-bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-top: 1px solid var(--border);
  padding: 10px 16px; display: flex; gap: 10px; z-index: 100;
}
.edit-bottom-bar .btn { flex: 1; }
.btn-reset { background: #fce8e6; color: var(--danger); }
.btn-confirm { background: var(--pass); color: #fff; }
.confirm-body { text-align: center; padding: 20px 16px; font-size: 15px; }
.confirm-actions { display: flex; gap: 10px; padding: 0 16px 16px; }
.confirm-actions .btn { flex: 1; }

/* New draft modal */
.new-draft-input {
  width: 100%; border: 1.5px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
  font-size: 16px; outline: none;
  margin-top: 8px;
}
.new-draft-input:focus { border-color: var(--primary); }

/* Empty state */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text2);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; margin-bottom: 16px; }
.empty-state .btn { display: inline-block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>ME NPI 生产自检表</h1>
    <p>机种NPI生产时ME Check List</p>
  </div>
  <div class="header-actions">
    <button class="header-btn" id="installBtn" style="display:none" onclick="pwaInstall()" title="安装为APP">📲</button>
    <button class="header-btn" id="btnEdit" onclick="toggleEditMode()" title="编辑检查项">⚙</button>
  </div>
</div>

<!-- PWA install hint banner (shown on file:// or when no install prompt available) -->
<div class="install-hint" id="installHint" style="display:none">
  <span>💡 提示：用 Chrome 打开 HTTPS 链接后可「添加到主屏幕」安装为 APP</span>
  <button onclick="document.getElementById('installHint').style.display='none'">×</button>
</div>

<div class="draft-bar" id="draftBar"></div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="progress-text" id="progressText">0 / 0 已填写</div>

<div class="edit-banner" id="editBanner" style="display:none">编辑模式 — 修改后点「保存修改」生效</div>

<!-- Meta info -->
<div class="meta-card" id="metaCard">
  <div class="meta-row">
    <div class="meta-field">
      <label>机种名称</label>
      <input type="text" id="modelName" placeholder="请输入机种" autocomplete="off">
    </div>
  </div>
  <div class="meta-row">
    <div class="meta-field">
      <label>生产日期</label>
      <input type="date" id="prodDate">
    </div>
    <div class="meta-field">
      <label>线别</label>
      <input type="text" id="lineNo" placeholder="例: L1" autocomplete="off">
    </div>
  </div>
  <div class="meta-row">
    <div class="meta-field">
      <label>点检人</label>
      <input type="text" id="checker" placeholder="姓名" autocomplete="off">
    </div>
  </div>
</div>

<!-- Items rendered by JS -->
<div id="itemsContainer"></div>
<div id="editContainer" style="display:none"></div>

<!-- Signature -->
<div class="meta-card" id="sigCard" style="margin-top:0">
  <div class="sig-area" style="padding:0">
    <label>签名确认</label>
    <canvas class="sig-canvas" id="sigCanvas"></canvas>
    <button class="sig-clear" onclick="clearSignature()">清除签名</button>
  </div>
</div>

<!-- History -->
<div class="history-section" id="historySection"></div>

<!-- Bottom bar: fill mode -->
<div class="bottom-bar" id="fillBar">
  <button class="btn btn-save" onclick="saveDraft()">暂存</button>
  <button class="btn btn-submit" id="btnSubmit" onclick="submitCheck()">完成并分享</button>
</div>

<!-- Bottom bar: edit mode -->
<div class="edit-bottom-bar" id="editBar" style="display:none">
  <button class="btn btn-reset" onclick="confirmResetTemplate()">恢复默认</button>
  <button class="btn btn-confirm" onclick="saveTemplate()">保存修改</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Submit modal -->
<div class="modal-overlay" id="submitModal">
  <div class="modal-box">
    <div class="modal-header">点检汇总</div>
    <div class="modal-body" id="summaryBody"></div>
    <div class="modal-footer">
      <button class="btn btn-save" onclick="closeModal('submitModal')">关闭</button>
      <button class="btn btn-submit" onclick="generateImage()">保存图片</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-body confirm-body" id="confirmBody"></div>
    <div class="confirm-actions" id="confirmActions"></div>
  </div>
</div>

<!-- New draft modal -->
<div class="modal-overlay" id="newDraftModal">
  <div class="modal-box">
    <div class="modal-header">新建点检记录</div>
    <div class="modal-body">
      <label style="font-size:13px;color:var(--text2);font-weight:600">机种名称</label>
      <input type="text" class="new-draft-input" id="newDraftName" placeholder="请输入机种名称" autocomplete="off">
    </div>
    <div class="modal-footer">
      <button class="btn btn-save" onclick="closeModal('newDraftModal')">取消</button>
      <button class="btn btn-submit" onclick="createNewDraft()">创建</button>
    </div>
  </div>
</div>

<script>
// === DEFAULT TEMPLATE ===
const DEFAULT_TEMPLATE = {
  sections: [
    {
      key: 'prep', label: '开线前准备', dot: 'dot-prep',
      items: [
        { id: 'i1', text: '试产时每天的日会是否有参加', photo: false },
        { id: 'i2', text: '人员的任务每日开线前是否分配清楚/是否有通知到RD现场', photo: false },
        { id: 'i3', text: 'PD 是否领用正确90的SOP上线', photo: false },
        { id: 'i4', text: 'PD 是否按SOP站位备料', photo: false },
        { id: 'i5', text: 'FE是否把扭力值测试OK', photo: false },
        { id: 'i6', text: 'QA是否依据BOM把料件对料OK', photo: false },
        { id: 'i7', text: '每站的治工具和耗材是否check OK(含参数点检)', photo: true },
      ]
    },
    {
      key: 'teach', label: '教线 / 首片', dot: 'dot-teach',
      items: [
        { id: 'i8', text: '教线是否按照拿着SOP一步一步来', photo: false },
        { id: 'i9', text: '教线每站的重点是否清楚', photo: false },
        { id: 'i10', text: '首片组包作业中,对SOP步骤不清楚或不理解的地方是否与RD确认清楚后再作业', photo: false },
        { id: 'i11', text: '首片每站做完是否拍照发群里供RD确认', photo: true },
      ]
    },
    {
      key: 'process', label: '作业过程', dot: 'dot-process',
      items: [
        { id: 'i12', text: 'SOP作业是否有问题,是否记录拍照,作业手法是否需优化', photo: true },

const DOT_OPTIONS = ['dot-prep','dot-teach','dot-process','dot-close','dot-custom'];

// === TEMPLATE MANAGEMENT ===
function loadTemplate() {
  try {
    const s = localStorage.getItem('npi_template');
    if (s) { const t = JSON.parse(s); if (t && t.sections && t.sections.length > 0) return t; }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
}
function saveTemplateToStorage(tpl) { localStorage.setItem('npi_template', JSON.stringify(tpl)); }
function saveTemplate() {
  const tpl = readEditTemplate();
  saveTemplateToStorage(tpl);
  template = tpl;
  exitEditMode();
  render();
  showToast('检查项已保存');
}
let template = loadTemplate();

// === MULTI-DRAFT MANAGEMENT ===
function genId() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

function loadAllDrafts() {
  try {
    const s = localStorage.getItem('npi_drafts');
    return s ? JSON.parse(s) : {};
  } catch(e) { return {}; }
}

function saveAllDrafts(drafts) {
  localStorage.setItem('npi_drafts', JSON.stringify(drafts));
}

function getActiveDraftId() {
  return localStorage.getItem('npi_active') || '';
}

function setActiveDraftId(id) {
  localStorage.setItem('npi_active', id);
}

let drafts = loadAllDrafts();
let activeId = getActiveDraftId();
let state = null;

// If active draft doesn't exist, pick first or create empty
if (activeId && drafts[activeId]) {
  state = drafts[activeId];
} else {
  const keys = Object.keys(drafts);
  if (keys.length > 0) {
    activeId = keys[0];
    state = drafts[activeId];
  } else {
    activeId = '';
    state = null;
  }
}

function defaultItemState() { return { result: '', remark: '', photos: [] }; }

function saveCurrentDraft() {
  if (!activeId || !state) return;
  readMetaFields();
  const toSave = {
    model: state.model, date: state.date, line: state.line,
    checker: state.checker, signature: state.signature,
    items: {},
  };
  for (const [k,v] of Object.entries(state.items)) {
    toSave.items[k] = { result: v.result, remark: v.remark };
  }
  drafts[activeId] = toSave;
  saveAllDrafts(drafts);
  setActiveDraftId(activeId);
}

function saveDraft() {
  saveCurrentDraft();
  showToast('已暂存');
}

function switchDraft(id) {
  if (id === activeId) return;
  // Save current first
  if (activeId && state) saveCurrentDraft();
  // Load target
  activeId = id;
  state = drafts[id];
  setActiveDraftId(id);
  writeMetaFields();
  initSignatureCanvas();
  render();
  renderDraftBar();
}

function createNewDraft() {
  const nameInput = document.getElementById('newDraftName');
  const name = nameInput.value.trim();
  if (!name) { showToast('请输入机种名称'); return; }
  closeModal('newDraftModal');

  const id = genId();
  const newState = {
    model: name,
    date: new Date().toISOString().slice(0,10),
    line: '', checker: '',
    items: {},
    signature: null,
  };
  drafts[id] = newState;
  saveAllDrafts(drafts);
  switchDraft(id);
  showToast('已创建: ' + name);
}

function deleteDraft(id) {
  const draft = drafts[id];
  const label = draft?.model || '此记录';
  showConfirm('确定删除「' + label + '」？', () => {
    delete drafts[id];
    saveAllDrafts(drafts);
    if (id === activeId) {
      const keys = Object.keys(drafts);
      if (keys.length > 0) {
        switchDraft(keys[0]);
      } else {
        activeId = '';
        state = null;
        setActiveDraftId('');
        render();
        renderDraftBar();
      }
    } else {
      renderDraftBar();
    }
  });
}

function showNewDraftModal() {
  document.getElementById('newDraftName').value = '';
  document.getElementById('newDraftModal').classList.add('active');
  setTimeout(() => document.getElementById('newDraftName').focus(), 100);
}

// === DRAFT BAR RENDER ===
function renderDraftBar() {
  const bar = document.getElementById('draftBar');
  bar.innerHTML = '';
  const keys = Object.keys(drafts);

  keys.forEach(id => {
    const d = drafts[id];
    const tab = document.createElement('div');
    tab.className = 'draft-tab' + (id === activeId ? ' active' : '');

    // Status dot
    const allIds = getAllItemIds();
    let filled = 0;
    for (const iid of allIds) {
      if (d.items?.[iid]?.result) filled++;
    }
    const total = allIds.length;
    let dotClass = 'tab-dot-empty';
    if (total > 0 && filled >= total) dotClass = 'tab-dot-done';
    else if (filled > 0) dotClass = 'tab-dot-filling';

    tab.innerHTML = `
      <span class="tab-dot ${dotClass}"></span>
      <span>${escHtml(d.model || '未命名')}</span>
      <button class="tab-close" data-id="${id}" title="删除">×</button>
    `;

    // Click tab to switch
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-close')) return;
      switchDraft(id);
    });

    // Close button
    tab.querySelector('.tab-close').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteDraft(id);
    });

    bar.appendChild(tab);
  });

  // Add button
  const addBtn = document.createElement('button');
  addBtn.className = 'draft-add-btn';
  addBtn.textContent = '+';
  addBtn.onclick = showNewDraftModal;
  bar.appendChild(addBtn);
}

// === HISTORY (IndexedDB) ===
let db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('NPIChecklist', 1);
    req.onupgradeneeded = (e) => { e.target.result.createObjectStore('records', { keyPath: 'id', autoIncrement: true }); };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}
async function saveToHistory(summary) {
  if (!db) await openDB();
  const tx = db.transaction('records', 'readwrite');
  tx.objectStore('records').add({
    model: state.model, date: state.date,
    line: state.line, checker: state.checker,
    summary: summary, createdAt: Date.now(),
  });
}
async function loadHistory() {
  if (!db) await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('records', 'readonly');
    const req = tx.objectStore('records').getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

// === HELPERS ===
function getAllItemIds() {
  const ids = [];
  for (const sec of template.sections) { for (const item of sec.items) ids.push(item.id); }
  return ids;
}
function getTotalItemCount() { return getAllItemIds().length; }

// === RENDER FILL MODE ===
function render() {
  const container = document.getElementById('itemsContainer');
  container.innerHTML = '';

  if (!state) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <p>还没有点检记录</p>
      <button class="btn btn-submit" style="padding:10px 24px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer" onclick="showNewDraftModal()">+ 新建记录</button>
    </div>`;
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressText').textContent = '';
    renderHistory();
    return;
  }

  let globalNo = 0;
  for (const sec of template.sections) {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    secDiv.innerHTML = `<div class="section-title"><span class="section-dot ${sec.dot}"></span>${escHtml(sec.label)}</div>`;

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function createItemCard(no, itemDef, itemState) {
  const card = document.createElement('div');
  card.className = 'item-card' + (itemState.result === 'fail' ? ' fail-card' : '');
  card.id = 'card-' + itemDef.id;
  card.innerHTML = `
    <div class="item-header">
      <span class="item-no">${no}</span>
      <span class="item-text">${escHtml(itemDef.text)}</span>
    </div>
    <div class="toggle-row">
      <button class="toggle-btn ${itemState.result==='pass'?'pass-on':''}" data-id="${itemDef.id}" data-val="pass">✓ OK</button>
      <button class="toggle-btn ${itemState.result==='fail'?'fail-on':''}" data-id="${itemDef.id}" data-val="fail">✗ NG</button>
      <button class="toggle-btn ${itemState.result==='na'?'na-on':''}" data-id="${itemDef.id}" data-val="na">— N/A</button>
    </div>
    <div class="remark-area">
      <textarea class="remark-input" data-id="${itemDef.id}" placeholder="备注..." rows="1">${itemState.remark||''}</textarea>
    </div>
    ${itemDef.photo ? `<div class="photo-area" data-id="${itemDef.id}">
      <label class="photo-btn" data-id="${itemDef.id}">📷 拍照<input type="file" class="photo-input" accept="image/*" capture="environment" data-id="${itemDef.id}"></label>
      <div class="photo-preview" data-id="${itemDef.id}"></div>
    </div>` : ''}
  `;
  card.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id; const v = btn.dataset.val;
      state.items[id].result = state.items[id].result === v ? '' : v;
      saveCurrentDraft();
      render();
      renderDraftBar();
    });
  });
  const ta = card.querySelector('.remark-input');
  ta.addEventListener('input', () => { state.items[itemDef.id].remark = ta.value; saveCurrentDraft(); });
  if (itemDef.photo) {
    card.querySelector('.photo-input').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { state.items[itemDef.id].photos.push(ev.target.result); renderPhotoPreview(itemDef.id); };
      reader.readAsDataURL(file);
    });
  }
  return card;
}

function renderPhotoPreview(id) {
  const preview = document.querySelector(`.photo-preview[data-id="${id}"]`);
  if (!preview) return;
  preview.innerHTML = '';
  (state.items[id]?.photos || []).forEach((src, i) => {
    const thumb = document.createElement('div'); thumb.className = 'photo-thumb';
    thumb.innerHTML = `<img src="${src}" alt="photo"><button class="del-photo" data-id="${id}" data-idx="${i}">×</button>`;
    preview.appendChild(thumb);
  });
  preview.querySelectorAll('.del-photo').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      state.items[btn.dataset.id].photos.splice(parseInt(btn.dataset.idx), 1);
      renderPhotoPreview(btn.dataset.id);
    });
  });
}

function updateProgress() {
  if (!state) return;
  const total = getTotalItemCount();
  let filled = 0;
  for (const id of getAllItemIds()) { if (state.items[id]?.result) filled++; }
  const pct = total > 0 ? Math.round(filled / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = filled + ' / ' + total + ' 已填写';
}

function writeMetaFields() {

  document.getElementById('modelName').value = state.model || '';

// === SIGNATURE ===
let sigDrawing = false;
let sigCtx = null;

function initSignatureCanvas() {
  const canvas = document.getElementById('sigCanvas');
  sigCtx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  sigCtx.scale(2, 2);
  sigCtx.strokeStyle = '#202124';
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  if (state?.signature) {
    const img = new Image();
    img.onload = () => { sigCtx.drawImage(img, 0, 0, rect.width, rect.height); };
    img.src = state.signature;
  }
}

function initSignature() {
  const canvas = document.getElementById('sigCanvas');
  initSignatureCanvas();

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function start(e) { e.preventDefault(); sigDrawing = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); }
  function move(e) { if (!sigDrawing) return; e.preventDefault(); const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); }
  function end(e) { sigDrawing = false; if (state) { state.signature = canvas.toDataURL(); saveCurrentDraft(); } }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

function clearSignature() {
  const canvas = document.getElementById('sigCanvas');
  const rect = canvas.getBoundingClientRect();
  sigCtx.clearRect(0, 0, rect.width * 2, rect.height * 2);
  if (state) { state.signature = null; saveCurrentDraft(); }
}

function renderEdit() {

function cycleSectionDot(si) { const i = DOT_OPTIONS.indexOf(template.sections[si].dot); template.sections[si].dot = DOT_OPTIONS[(i+1)%DOT_OPTIONS.length]; renderEdit(); }
function moveSection(si, dir) { const ni=si+dir; if(ni<0||ni>=template.sections.length)return; [template.sections[si],template.sections[ni]]=[template.sections[ni],template.sections[si]]; renderEdit(); }
function deleteSection(si) { if(template.sections.length<=1){showToast('至少保留一个分类');return;} showConfirm('确定删除分类「'+template.sections[si].label+'」？',()=>{template.sections.splice(si,1);renderEdit();}); }
function addSection() { template.sections.push({key:'sec_'+genId(),label:'新分类',dot:'dot-custom',items:[]}); renderEdit(); window.scrollTo(0,document.body.scrollHeight); }
function addItem(si) { template.sections[si].items.push({id:genId(),text:'新检查项',photo:false}); renderEdit(); }
function deleteItem(si,ii) { showConfirm('确定删除此检查项？',()=>{template.sections[si].items.splice(ii,1);renderEdit();}); }
function moveItem(si,ii,dir) {
  const items=template.sections[si].items; const ni=ii+dir;
  if(ni<0){if(si<=0)return;const item=items.splice(ii,1)[0];template.sections[si-1].items.push(item);}
  else if(ni>=items.length){if(si>=template.sections.length-1)return;const item=items.splice(ii,1)[0];template.sections[si+1].items.unshift(item);}
  else{[items[ii],items[ni]]=[items[ni],items[ii]];}
  renderEdit();
}
function toggleItemPhoto(si,ii) { template.sections[si].items[ii].photo=!template.sections[si].items[ii].photo; renderEdit(); }

function readEditTemplate() {
  document.querySelectorAll('.sec-name').forEach(input=>{template.sections[parseInt(input.dataset.si)].label=input.value||'未命名';});
  document.querySelectorAll('.edit-item-text').forEach(input=>{template.sections[parseInt(input.dataset.si)].items[parseInt(input.dataset.ii)].text=input.value||'未填写';});
  return JSON.parse(JSON.stringify(template));
}

function confirmResetTemplate() {
  showConfirm('确定恢复为默认检查项？当前修改将丢失。',()=>{
    template=JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));

}

// === SUBMIT ===
function submitCheck() {
  if (!state) { showNewDraftModal(); return; }
  readMetaFields();
  if (!state.model || !state.date || !state.checker) { showToast('请先填写机种、日期、点检人'); return; }
  const allIds = getAllItemIds();
  let unfilled = 0;
  for (const id of allIds) { if (!state.items[id]?.result) unfilled++; }
  if (unfilled > 0 && !confirm(`还有 ${unfilled} 项未填写，确定提交吗？`)) return;
  showSummary();
}

function showSummary() {
  const body = document.getElementById('summaryBody');
  let passCount=0, failCount=0, naCount=0, emptyCount=0;
  const allIds = getAllItemIds();
  for (const id of allIds) {
    const r = state.items[id]?.result;
    if (r==='pass') passCount++; else if (r==='fail') failCount++; else if (r==='na') naCount++; else emptyCount++;
  }
  let html = `<div style="margin-bottom:12px;font-weight:700;text-align:center">
    <span style="color:var(--pass)">✓ ${passCount} OK</span>&nbsp;&nbsp;
    <span style="color:var(--fail)">✗ ${failCount} NG</span>&nbsp;&nbsp;
    <span style="color:var(--na)">— ${naCount} N/A</span>&nbsp;&nbsp;
    <span style="color:var(--text2)">${emptyCount} 未填</span>
  </div>`;
  let globalNo = 0;
  for (const sec of template.sections) {
    html += `<div style="font-weight:700;font-size:13px;margin:8px 0 4px;color:var(--text2)">${escHtml(sec.label)}</div>`;
    for (const item of sec.items) {
      globalNo++;
      const r = state.items[item.id]?.result;
      let icon = '⬜'; if(r==='pass')icon='✅'; else if(r==='fail')icon='❌'; else if(r==='na')icon='➖';
      const remark = state.items[item.id]?.remark ? ` <span style="color:var(--text2)">(${escHtml(state.items[item.id].remark)})</span>` : '';
      html += `<div class="summary-item"><span class="si-icon">${icon}</span><span class="si-text">${globalNo}. ${escHtml(item.text)}${remark}</span></div>`;
    }
  }
  body.innerHTML = html;
  document.getElementById('submitModal').classList.add('active');
}

// === GENERATE IMAGE ===
async function generateImage() {
  closeModal('submitModal');
  showToast('生成中...');

  const W=800, LINE_H=32, PAD=40;
  const PHOTO_SIZE=100, PHOTO_GAP=8, PHOTO_PAD=60;

  // Preload all photos and collect layout info
  const photoLoadPromises = [];
  const itemPhotos = {}; // itemId -> [HTMLImageElement, ...]
  let photoRowCount = 0;

  for (const sec of template.sections) {
    for (const item of sec.items) {
      const photos = state.items[item.id]?.photos || [];
      if (photos.length > 0) {
        itemPhotos[item.id] = [];
        photoRowCount++; // "现场照片:" label row
        for (const src of photos) {
          const p = new Promise((resolve) => {
            const img = new Image();
            img.onload = () => { itemPhotos[item.id].push(img); resolve(); };
            img.onerror = () => resolve();
            img.src = src;
          });
          photoLoadPromises.push(p);
        }
        // Calculate rows needed for photos (2 per row)
        photoRowCount += Math.ceil(photos.length / 2);
      }
    }
  }
  await Promise.all(photoLoadPromises);

  const allIds = getAllItemIds();
  let remarkCount=0;
  for(const id of allIds){if(state.items[id]?.remark)remarkCount++;}
  const totalLines=allIds.length+template.sections.length+remarkCount+photoRowCount;
  const H=PAD+120+totalLines*LINE_H+100+PAD;

  const canvas = document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');

  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a73e8'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ME NPI 生产自检表',W/2,PAD+32);
  ctx.font='16px sans-serif'; ctx.fillStyle='#5f6368';
  ctx.fillText('机种NPI生产时ME Check List',W/2,PAD+56);
  ctx.textAlign='left'; ctx.font='15px sans-serif'; ctx.fillStyle='#202124';
  const y0=PAD+90;
  ctx.fillText('机种: '+(state.model||'-'),PAD,y0);
  ctx.fillText('日期: '+(state.date||'-'),PAD+260,y0);
  ctx.fillText('线别: '+(state.line||'-'),PAD,y0+24);
  ctx.fillText('点检人: '+(state.checker||'-'),PAD+260,y0+24);
  let y=y0+48;
  ctx.strokeStyle='#dadce0'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); y+=16;

  let passC=0,failC=0,naC=0,globalNo=0;
  for(const sec of template.sections){
    ctx.font='bold 15px sans-serif'; ctx.fillStyle='#5f6368'; ctx.fillText(sec.label,PAD,y+4); y+=LINE_H;
    for(const item of sec.items){
      globalNo++;
      const r=state.items[item.id]?.result;
      let icon='⬜',color='#9aa0a6';
      if(r==='pass'){icon='✅';color='#34a853';passC++;}else if(r==='fail'){icon='❌';color='#ea4335';failC++;}else if(r==='na'){icon='➖';color='#9aa0a6';naC++;}
      ctx.font='14px sans-serif'; ctx.fillStyle=color; ctx.fillText(icon,PAD,y+4);
      ctx.fillStyle='#202124'; ctx.fillText(globalNo+'. '+item.text,PAD+28,y+4); y+=LINE_H;
      if(state.items[item.id]?.remark){ctx.fillStyle='#5f6368';ctx.font='13px sans-serif';ctx.fillText('    → '+state.items[item.id].remark,PAD+28,y+4);y+=LINE_H;}

      // Embed photo thumbnails
      const photos = itemPhotos[item.id] || [];
      if (photos.length > 0) {
        ctx.font='13px sans-serif'; ctx.fillStyle='#1a73e8';
        ctx.fillText('    📷 现场照片:',PAD+28,y+4); y+=LINE_H;
        let px = PHOTO_PAD;
        for (let pi=0; pi<photos.length; pi++) {
          if (pi > 0 && pi % 2 === 0) { px = PHOTO_PAD; y += PHOTO_SIZE + PHOTO_GAP; }
          try {
            ctx.save();
            // Draw rounded rect clip
            const rx=px, ry=y, rs=PHOTO_SIZE, rr=6;
            ctx.beginPath();
            ctx.moveTo(rx+rr,ry); ctx.lineTo(rx+rs-rr,ry); ctx.quadraticCurveTo(rx+rs,ry,rx+rs,ry+rr);
            ctx.lineTo(rx+rs,ry+rs-rr); ctx.quadraticCurveTo(rx+rs,ry+rs,rx+rs-rr,ry+rs);
            ctx.lineTo(rx+rr,ry+rs); ctx.quadraticCurveTo(rx,ry+rs,rx,ry+rs-rr);
            ctx.lineTo(rx,ry+rr); ctx.quadraticCurveTo(rx,ry,rx+rr,ry);
            ctx.closePath(); ctx.clip();
            ctx.drawImage(photos[pi], rx, ry, rs, rs);
            ctx.restore();
            // Border
            ctx.strokeStyle='#dadce0'; ctx.lineWidth=1;
            ctx.strokeRect(rx, ry, rs, rs);
          } catch(e) {}
          px += PHOTO_SIZE + PHOTO_GAP;
        }
        y += PHOTO_SIZE + PHOTO_GAP + 4;
      }
    }
  }

  y+=8; ctx.strokeStyle='#dadce0'; ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); y+=20;
  ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='#34a853'; ctx.fillText('✓ '+passC+' OK',W/2-120,y+4);
  ctx.fillStyle='#ea4335'; ctx.fillText('✗ '+failC+' NG',W/2,y+4);
  ctx.fillStyle='#9aa0a6'; ctx.fillText('— '+naC+' N/A',W/2+120,y+4);
  if(state.signature){
    y+=30; ctx.strokeStyle='#dadce0'; ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); y+=12;
    ctx.font='13px sans-serif'; ctx.fillStyle='#5f6368'; ctx.textAlign='left'; ctx.fillText('签名:',PAD,y+4);
    try{const sigImg=new Image();sigImg.src=state.signature;ctx.drawImage(sigImg,PAD+50,y-16,200,40);}catch(e){}
  }
  canvas.toBlob(async(blob)=>{
    const fileName='NPI自检表_'+(state.model||'')+'_'+(state.date||'')+'.png';
    try{
      const file=new File([blob],fileName,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'NPI自检表'});}
      else{downloadBlob(blob,fileName);}
      saveToHistory({pass:passC,fail:failC,na:naC});
      showToast('图片已保存，可发送到微信');
    }catch(e){downloadBlob(blob,fileName);showToast('图片已保存');}
  },'image/png');
}

function downloadBlob(blob,name) {
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
}

// === HISTORY UI ===
async function renderHistory() {
  const records = await loadHistory();
  const section = document.getElementById('historySection');
  if (records.length === 0) { section.innerHTML = ''; return; }
  section.innerHTML = '<div class="section-title"><span class="section-dot dot-close"></span>历史记录</div>';
  records.reverse().forEach(r => {
    const d = new Date(r.createdAt);
    const dateStr = (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    const s = r.summary || {};
    const card = document.createElement('div'); card.className = 'history-card';
    card.innerHTML = `
      <div class="history-meta"><span class="history-model">${escHtml(r.model||'-')}</span><span>${dateStr}</span></div>
      <div class="history-stats">日期: ${escHtml(r.date||'-')} | 线别: ${escHtml(r.line||'-')} | 点检人: ${escHtml(r.checker||'-')}<br>✓${s.pass||0} OK  ✗${s.fail||0} NG  —${s.na||0} N/A</div>
    `;
    section.appendChild(card);
  });
}

// === TOAST ===
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// === PWA INSTALL ===
async function pwaInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    if (result.outcome === 'accepted') showToast('已安装到主屏幕');
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  } else {
    showToast('请用 Chrome 打开 HTTPS 链接后重试');
  }
}

// === INIT ===
async function init() {
  // Migrate old single-draft format if exists
  try {
    const old = localStorage.getItem('npi_draft');
    if (old && Object.keys(drafts).length === 0) {
      const oldState = JSON.parse(old);
      if (oldState && oldState.model) {
        const id = genId();
        drafts[id] = oldState;
        saveAllDrafts(drafts);
        if (!activeId) { activeId = id; state = oldState; setActiveDraftId(id); }
      }
      localStorage.removeItem('npi_draft');
    }
  } catch(e) {}

  // Show install hint if on file:// (no PWA possible)
  if (location.protocol === 'file:') {
    document.getElementById('installHint').style.display = 'flex';
  }

  writeMetaFields();
  renderDraftBar();
  render();
  initSignature();
  await openDB();
  renderHistory();
}

init();
